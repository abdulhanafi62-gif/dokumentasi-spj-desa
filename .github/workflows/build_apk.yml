name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Scaffold Android Files
        run: flutter create . --org com.desaku --project-name dokumentasi_spj_desa --platforms=android

      - name: Configure Android SDK versions
        run: |
          python3 -c "
          with open('android/build.gradle', 'r') as f:
              content = f.read()
          patch = '''
          allprojects {
              ext.compileSdkVersion = 35
              ext.targetSdkVersion = 35
              ext.minSdkVersion = 21
          }
          '''
          with open('android/build.gradle', 'w') as f:
              f.write(patch + '\n' + content)
          "
          sed -i 's/compileSdk.*/compileSdk = 35/g' android/app/build.gradle || true
          sed -i 's/compileSdkVersion.*/compileSdkVersion 35/g' android/app/build.gradle || true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dokumentasi-SPJ-Desa-APK
          path: build/app/outputs/flutter-apk/app-release.apk
