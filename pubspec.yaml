name: dokumentasi_spj_desa
description: "Aplikasi Dokumentasi SPJ Desa - Pengadaan Barang dan Pembangunan Fisik dengan Ekspor PDF & DOCX (A4)"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  image_picker: ^1.1.2
  pdf: ^3.11.1
  printing: ^5.13.2
  archive: ^3.6.1
  image: ^4.3.0
  path_provider: ^2.1.4
  share_plus: ^10.1.2
  intl: ^0.19.0
  geolocator: ^13.0.1
  shared_preferences: ^2.3.2
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
